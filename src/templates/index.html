<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기사 즉시 점검</title>
<style>
  :root { --fg:#24292f; --muted:#57606a; --line:#d0d7de; --bg:#ffffff; --panel:#f6f8fa; --accent:#0969da; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  textarea { width:100%; min-height: 160px; padding:12px; font: inherit; font-size:14px; border:1px solid var(--line); border-radius:8px; resize: vertical; }
  .row { display:flex; justify-content: space-between; align-items:center; margin-top:8px; gap:12px; }
  .hint { color: var(--muted); font-size: 13px; }
  button { background: var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 22px; font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap; }
  button:disabled { opacity: .6; cursor: progress; }
  #result { margin-top: 24px; border-top:1px solid var(--line); padding-top: 20px; }
  #result:empty { display:none; }
  .notice { padding:12px 16px; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  .error { padding:12px 16px; background:#ffebe9; border:1px solid #ff8182; border-radius:8px; }
  .loading { color: var(--muted); }
  details { margin: 10px 0; border:1px solid var(--line); border-radius:8px; padding: 8px 12px; background: var(--panel); }
  summary { cursor:pointer; font-weight:600; font-size:14px; overflow-wrap:anywhere; }
  pre { white-space: pre-wrap; overflow-wrap:anywhere; font-size:12px; margin:4px 0 8px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:8px; }
  .ctx, .step { margin-top:8px; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>🔍 기사 즉시 점검</h1>
  <p class="sub">보안 기사 URL 또는 본문을 넣으면 요약, ISMS-P 체크리스트 점검 결과, 수정 제안을 보여 줍니다. 결과는 저장되지 않습니다.</p>

  <textarea id="question" placeholder="기사 URL 또는 본문을 붙여넣으세요&#10;예) https://www.boannews.com/news/articleView.html?idxno=140597" maxlength="{{ max_chars }}"></textarea>
  <div class="row">
    <span class="hint" id="count">0 / {{ "{:,}".format(max_chars) }}자 · 처리에 30초 안팎 걸립니다</span>
    <button id="run">점검하기</button>
  </div>

  <section id="result" aria-live="polite"></section>
</main>

<script>
  const q = document.getElementById("question");
  const btn = document.getElementById("run");
  const out = document.getElementById("result");
  const count = document.getElementById("count");
  const MAX = {{ max_chars }};

  q.addEventListener("input", () => {
    count.textContent = `${q.value.length.toLocaleString()} / ${MAX.toLocaleString()}자 · 처리에 30초 안팎 걸립니다`;
  });

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    const started = Date.now();
    out.innerHTML = '<p class="loading">점검 중… (0초)</p>';
    const timer = setInterval(() => {
      out.querySelector(".loading").textContent = `점검 중… (${Math.round((Date.now() - started) / 1000)}초)`;
    }, 1000);
    try {
      const res = await fetch("/ui/check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q.value }),
      });
      // 서버가 Jinja2 자동 이스케이프로 만든 HTML 조각이다 (기사·모델 출력의 HTML은 실행되지 않음)
      out.innerHTML = res.ok ? await res.text() : '<div class="error">처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</div>';
    } catch (e) {
      out.innerHTML = '<div class="error">서버에 연결하지 못했습니다.</div>';
    } finally {
      clearInterval(timer);
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
